name: 功能建议
description: 新任务类型、界面改进、兼容性适配
title: "[Feature] "
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
      description: 可选
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 只影响界面
        - 影响某个任务
        - 影响所有任务
        - 构建 / 发布相关
    validations:
      required: true
