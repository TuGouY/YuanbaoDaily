name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testXposedDebugUnitTest testLiteDebugUnitTest --stacktrace

      - name: Build release APKs
        run: ./gradlew assembleXposedRelease assembleLiteRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/xposed/release/app-xposed-release.apk  dist/YuanbaoDaily-root.apk
          cp app/build/outputs/apk/lite/release/app-lite-release.apk      dist/YuanbaoDaily-noroot.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YuanbaoDaily-apk
          path: dist/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
