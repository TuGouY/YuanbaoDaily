name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不依赖 android-actions/setup-android：GitHub 的 ubuntu runner 自带 Android SDK，
      # 第三方 action 在新镜像上经常跑不起来（v1.5.4 的构建就卡在这一步）。
      - name: Prepare Android SDK
        run: |
          set -u
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes 2>/dev/null | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          else
            echo "sdkmanager 不存在，交给 Gradle 自行解析"
          fi
          ls "$SDK/platforms" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testXposedDebugUnitTest testLiteDebugUnitTest --stacktrace

      - name: Build release APKs
        run: ./gradlew assembleXposedRelease assembleLiteRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/xposed/release/app-xposed-release.apk  dist/YuanbaoDaily-root.apk
          cp app/build/outputs/apk/lite/release/app-lite-release.apk      dist/YuanbaoDaily-noroot.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YuanbaoDaily-apk
          path: dist/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
